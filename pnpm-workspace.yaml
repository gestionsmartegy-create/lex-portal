allowBuilds:
  supabase: true
  "@parcel/watcher": false
  "@swc/core": false
  sharp: false
  unrs-resolver: false
# Délai minimal avant d'installer une nouvelle version publiée : 1 jour (valeur de pnpm 11,
# rendue explicite, ADR 0011). Les mises à jour courantes passent par Dependabot (7 jours).
# Exceptions ci-dessous : versions épinglées volontairement (ADR 0006/0007).
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@next/env@16.3.8"
  - "@next/eslint-plugin-next@16.3.8"
  - "@next/swc-darwin-arm64@16.3.8"
  - "@next/swc-darwin-x64@16.3.8"
  - "@next/swc-linux-arm64-gnu@16.3.8"
  - "@next/swc-linux-arm64-musl@16.3.8"
  - "@next/swc-linux-x64-gnu@16.3.8"
  - "@next/swc-linux-x64-musl@16.3.8"
  - "@next/swc-win32-arm64-msvc@16.3.8"
  - "@next/swc-win32-x64-msvc@16.3.8"
  - eslint-config-next@16.3.8
  - next@16.3.8
  - "@supabase/cli-darwin-arm64@2.119.0"
  - "@supabase/cli-darwin-x64@2.119.0"
  - "@supabase/cli-linux-arm64-musl@2.119.0"
  - "@supabase/cli-linux-arm64@2.119.0"
  - "@supabase/cli-linux-x64-musl@2.119.0"
  - "@supabase/cli-linux-x64@2.119.0"
  - "@supabase/cli-windows-arm64@2.119.0"
  - "@supabase/cli-windows-x64@2.119.0"
  - supabase@2.119.0
  - "@shadcn/registry@0.1.0"
  - shadcn@4.21.1
