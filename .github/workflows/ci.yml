# Intégration continue — ADR 0008 (actions épinglées par SHA : ADR 0009).
# Compte GitHub gratuit : ces contrôles ne sont pas imposés techniquement.
# Règle (AGENTS.md §10) : ne JAMAIS fusionner une demande dont un contrôle est rouge ou en cours.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  app:
    name: Application (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 — version de pnpm lue dans package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Dépendances de production vulnérables (gravité haute ou critique) : bloquant (ADR 0011).
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    name: Base de données (tests pgTAP, intégration, e2e, dérive des types)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Services strictement nécessaires : Postgres, Auth (crée auth.*), PostgREST, Kong, postgres-meta (types).
      # Sortie redirigée : elle contient les clés de démonstration locales.
      # Mailpit (e-mails locaux) est démarré : test des alertes de sécurité (ADR 0011).
      - name: Démarrer Supabase local (migrations + seed)
        run: pnpm exec supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor > /dev/null
      - name: Tests pgTAP (bloquants)
        run: pnpm db:test
      - name: Tests d'intégration (vraies sessions Auth, ADR 0010)
        run: pnpm test:integration
      # e2e (ADR 0011) : build de production + Chromium, contre ce même Supabase local.
      - name: Installer Chromium (Playwright)
        run: pnpm exec playwright install --with-deps chromium
      - name: Tests de bout en bout et accessibilité (Playwright + axe)
        run: pnpm test:e2e
      - name: Types générés à jour
        run: |
          pnpm db:types
          git diff --exit-code -- types/database.ts \
            || (echo "::error::types/database.ts n'est pas à jour : lancer « pnpm db:types » et committer." && exit 1)
      - name: Arrêter Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup > /dev/null 2>&1 || true

  secrets:
    name: Sécurité (secrets, analyse de code)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      # Version épinglée, publiée depuis plus de 7 jours (même délai que Dependabot).
      SEMGREP_VERSION: 1.178.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Installer gitleaks (binaire officiel, somme de contrôle vérifiée)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "$base/$file"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" gitleaks
      - name: Analyse
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .
      # Analyse statique (ADR 0011) : Semgrep CE exécuté dans le runner, SANS envoi du code
      # ni télémétrie. CodeQL exige GitHub Advanced Security pour un dépôt privé (compte gratuit).
      - name: Installer Semgrep
        run: |
          python3 -m venv .semgrep
          .semgrep/bin/pip install --quiet --no-cache-dir "semgrep==${SEMGREP_VERSION}"
      - name: Analyse de code (bloquante sur les erreurs)
        run: |
          .semgrep/bin/semgrep scan --metrics=off --error --severity ERROR \
            --config p/typescript --config p/react --config p/nextjs --config p/secrets \
            --exclude .semgrep --exclude node_modules
