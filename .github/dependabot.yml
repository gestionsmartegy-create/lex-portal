# Mises à jour de sécurité et de dépendances (ADR 0008). Chaque demande passe par la CI.
version: 2
updates:
  - package-ecosystem: npm # pnpm (pnpm-lock.yaml)
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Halifax
    open-pull-requests-limit: 5
    # Délai de prudence : une version doit avoir 7 jours avant d'être proposée (ADR 0009, F6).
    cooldown:
      default-days: 7
    groups:
      dependencies:
        update-types: [minor, patch]
    # Versions épinglées volontairement (ADR 0006) : majeures traitées à la main.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: next
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Halifax
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
